plugins {
    id 'java'
}

group = 'com.slg'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    compileOnly files('libs/MBedwars.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.fork = true
    options.forkOptions.executable = '/usr/lib/jvm/java-21-openjdk/bin/javac'
}

jar {
    archiveBaseName = 'ExclusiveArenas'
}
