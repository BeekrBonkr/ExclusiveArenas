# ExclusiveArenas Configuration
# Plugin version this config was generated for. Do not change — used for automatic migration.
#
# Related files (same folder):
#   lang.yml — every chat message the plugin sends.
#   guis.yml — every menu's layout, button materials, names, lore and glints.
config-version: 7

# Verbose debug logging. When true, ExclusiveArenas logs detailed database and sync activity
# to the console. Leave false for normal operation — errors are always logged regardless.
debug: false

# Continuous health checking: every health_check_seconds, every active private session is
# checked against MBedwars' actual live arena state (not just trusted to stay in sync) and
# self-healed if it's drifted — a session whose arena silently went STOPPED is ended, a
# spawner that's stopped ticking is flagged, and MBedwars' own arena config issues are logged.
stability:
  health_check_seconds: 30
  # A match RUNNING for longer than timeline.max_match_time plus this many seconds of grace is
  # logged as possibly stuck. It's only actually force-ended if force_end_stuck_matches is true.
  stuck_match_grace_seconds: 300
  # Off by default — force-ending a match automatically is a real action worth opting into
  # deliberately, not a surprise. Until enabled, a stuck match is only ever logged, never touched.
  force_end_stuck_matches: false

# Set true on your HUB/lobby server(s). When true, ExclusiveArenas prefixes the arena name
# with '@' when routing a player to a match on another backend (MBedwars' remote-arena marker),
# so cross-server joins work without you editing join_command_template by hand.
is_hub_server: false

# Unique id for THIS backend server. Stamped on sessions it creates in the shared database.
# Give every server on the network a distinct value.
server_id: "server-1"

# Cross-server state is shared through our own MySQL/MariaDB database (not MBedwars').
# When disabled, the plugin runs single-server in-memory exactly as before.
database:
  enabled: false
  host: "localhost"
  port: 3306
  database: "exclusivearenas"
  user: "root"
  password: ""
  # Tables are created as <table_prefix>sessions and <table_prefix>tickets.
  table_prefix: "ea_"
  use_ssl: false
  # How often (seconds) each backend reconciles its caches against the database.
  session_poll_seconds: 4
  ticket_poll_seconds: 1
  # How often each backend checks for remote commands queued against arenas it hosts (e.g. a
  # host clicking Start/End Match from another server). Lower = more responsive remote control.
  command_poll_seconds: 2
  # Crash resilience: every backend stamps its own heartbeat on every session poll. Any backend
  # can then notice another one hasn't been heard from in a while and purge its orphaned
  # sessions/tickets/commands — so a crashed server's private matches don't sit in the shared
  # database forever, looking "active" to the rest of the network.
  #
  # How often (seconds) any one backend sweeps for other servers that have gone quiet.
  dead_server_sweep_seconds: 120
  # How long (seconds) with no heartbeat before a server is considered dead. Keep this a
  # generous multiple of session_poll_seconds so a slow poll or brief network blip is never
  # mistaken for a crash — the default is roughly 22x the default 4s poll interval.
  dead_server_after_seconds: 90

network:
  # Command dispatched (as the player) to transfer them to the backend hosting an arena that
  # is not on this server. Placeholders: %arena% = arena name, %player% = player name.
  join_command_template: "bw join %arena%"

private:
  # How long (in seconds) a join ticket stays valid before it expires. A ticket authorises
  # one player to pass gating for a single join attempt (and to survive a cross-server hop).
  ticket_ttl_seconds: 30

  # Default number of simultaneous private matches a player may host when they have no
  # exclusivearenas.limit.<n> permission. Grant exclusivearenas.limit.5 for five, or
  # exclusivearenas.limit.unlimited (and exclusivearenas.admin) for no cap.
  default_arena_limit: 1

  # Length of generated join codes, in characters (minimum 4).
  join_code_length: 6

  # Auto-summon (continuously syncing the host's party with the match) is currently retired
  # from the menus. The machinery is still here for a future release — flip this to true to
  # re-enable the background sync task for sessions that have the flag set.
  auto_summon_enabled: false

  # How often (seconds) the auto-summon task (when enabled above) checks online players and
  # pulls new party members into a match whose host enabled "Auto-summon".
  auto_summon_poll_seconds: 5

  # Shows everyone inside a private match's arena an orange-ish boss bar stating that it's
  # private, its join policy, and whether the timer is currently paused.
  bossbar_enabled: true

  # How long (in minutes) to keep a private session alive after the host leaves the lobby.
  # Once this expires with no host present, the session is ended and the arena is released.
  host_abandon_timeout_minutes: 5

  # Sessions older than this many hours are forcibly ended to prevent stuck state.
  # Only applies when the arena is not in an active RUNNING game.
  stale_session_hours: 12

  # A lobby with no active players in it (everyone's spectating, or nobody ever actually
  # joined) is warned in-arena and — if the host is online elsewhere — directly, then closed
  # if it's still empty of active players after the grace period. This catches hosts/guests
  # who are online but never got around to starting (or left everyone spectating). Set
  # inactivity_warning_minutes to 0 to disable this check entirely.
  inactivity_warning_minutes: 10
  inactivity_close_grace_minutes: 5

# ExclusiveArenas registers an MBedwars arena-picker condition variable named
# "exclusivearenas_private" (1 while an arena hosts one of our private matches, else 0).
# To keep reserved private lobbies out of MBedwars' own ArenasGUI menu, add a condition to
# the "arenas-collection" element(s) of your live ArenasGUI layout file(s)
# (plugins/MBedwars/arenasgui-layouts/...), e.g.:
#   - type: arenas-collection
#     condition: "[exclusivearenas_private=0]"
#     area: ...

# ExclusiveArenas also registers four custom MBedwars lobby hotbar item handlers. Registering
# only makes them available — add an entry referencing one to your live lobby-hotbar.yml
# (plugins/MBedwars/configs/.../lobby-hotbar.yml) to actually give players the item. Slot is
# yours to choose; name/item are placeholders only — every handler below overrides its own
# icon/name/lore at render time (see lang.yml's matching section for the exact text):
#   open-controls:
#     name: '&eMatch Controls'
#     slot: 2
#     handler: 'exclusivearenas:open_controls'    # only visible to the match's host
#     item: 'command_block'
#   toggle-spectate:
#     name: '&7Spectate This Match'
#     slot: 3
#     handler: 'exclusivearenas:toggle_spectate'   # any active player; opts out of playing.
#     item: 'gray_dye'                             # Hidden once they're actually spectating.
#   rejoin-as-player:
#     name: '&aRejoin as Player'
#     slot: 3
#     handler: 'exclusivearenas:rejoin_as_player'  # any spectator; switches back to playing.
#     item: 'lime_dye'                             # Hidden once the round is running or full.
#   summon-party:
#     name: '&eSummon Party'
#     slot: 4
#     handler: 'exclusivearenas:summon_party'      # host only, and only on party-gated matches.
#     item: 'ender_pearl'

# ── Event timeline ────────────────────────────────────────────────────────────
# The default in-match event schedule for every private match. Hosts can move or
# delete these per match via Arena Settings → Event Timeline; this section only
# defines what a fresh match starts with.
#
# Each event needs:
#   name        — shown in menus and the in-arena broadcast when it fires.
#   icon        — Bukkit material for its timeline item.
#   time        — "m:ss" (or plain seconds) after round start.
#   type        — one of:
#       spawner_speed — speeds up generators of one resource. Needs drop_type
#                       (the MBedwars drop type id from its spawners config —
#                       check yours; common ids are iron/gold/diamond/emerald)
#                       and multiplier (0.5 = drops twice as fast). Multipliers
#                       stack with earlier events of the same drop type.
#       destroy_beds  — destroys every remaining bed (sudden death).
#       match_end     — sets MBedwars' in-game time limit so the match ends
#                       here. EXACTLY ONE event must have this type, and it
#                       can't be deleted in the editor — only moved.
#   description — one line explaining the effect (shown as menu lore).
#
# Events whose drop_type doesn't exist on this server are skipped with a log
# message, so a shared config works across differently-configured backends.
timeline:
  # Master switch: when false, private matches run with MBedwars' plain
  # behaviour and the timeline editor is hidden.
  enabled: true
  # Which engine runs the schedule:
  #   auto     — use MBedwarsTweaks' gen tiers when that plugin is installed (the editor's
  #              defaults then come from the Tweaks config, custom timings are applied by
  #              rewriting Tweaks' own scheduling, and the scoreboard's next-event timer
  #              shows them correctly). Falls back to the internal engine without Tweaks.
  #   internal — always use the built-in engine below, even with Tweaks installed.
  backend: "auto"
  # Hosts can drag Match End out via the timeline editor or /ea timeline set/move — this
  # caps how long a match can ever be pushed to, however it's edited. "m:ss" or plain seconds.
  max_match_time: "60:00"
  #
  # Every entry below is an event definition. Beyond the original set of types
  # (spawner_speed, destroy_beds, sudden_death, match_end), hosts can now also add:
  #   resource_burst   — one-time bonus drop from every generator of drop_type, right now.
  #   team_buff        — grants everyone in the arena a timed potion effect.
  #                       drop_type = "POTION_TYPE:amplifier:seconds", e.g. "SPEED:1:30".
  #   trap_chaos       — force-triggers a random team's queued trap, if any are queued.
  #   weather_change   — changes the arena's weather. drop_type = an ArenaWeatherType name
  #                       (CLEAR, RAINING, UNTOUCHED).
  #   time_change      — changes the arena's time of day. drop_type = an ArenaTimeType name
  #                       (NOON, SUNSET, NIGHT, UNTOUCHED).
  #   announcement     — pure broadcast, no gameplay effect. drop_type = the message.
  #   fireworks        — cosmetic firework show over the arena.
  #
  # 'default: false' marks an event as an optional extra that ISN'T part of a fresh match's
  # starting schedule — hosts add it themselves later via the timeline editor's "Add Event"
  # button (or /ea timeline add <id>) when they actually want it. Omit it (or set true) for
  # anything that should just always be there by default, as every event below already is.
  #
  # A host isn't limited to this catalog either — /ea timeline custom <type> <value> <time>
  # lets them create a one-off event of any of the seven types above from scratch, without
  # an admin needing to pre-configure it here at all.
  events:
    diamond2:
      name: "Diamond II"
      icon: DIAMOND
      time: "6:00"
      type: spawner_speed
      drop_type: diamond
      multiplier: 0.75
      description: "&bDiamond&7 generators drop 25% faster."
    emerald2:
      name: "Emerald II"
      icon: EMERALD
      time: "9:00"
      type: spawner_speed
      drop_type: emerald
      multiplier: 0.75
      description: "&aEmerald&7 generators drop 25% faster."
    diamond3:
      name: "Diamond III"
      icon: DIAMOND_BLOCK
      time: "12:00"
      type: spawner_speed
      drop_type: diamond
      multiplier: 0.66
      description: "&bDiamond&7 generators speed up again."
    emerald3:
      name: "Emerald III"
      icon: EMERALD_BLOCK
      time: "15:00"
      type: spawner_speed
      drop_type: emerald
      multiplier: 0.66
      description: "&aEmerald&7 generators speed up again."
    bed_destruction:
      name: "Bed Destruction"
      icon: RED_BED
      time: "20:00"
      type: destroy_beds
      description: "&cAll beds are destroyed &7— no more respawns."
    match_end:
      name: "Match End"
      icon: CLOCK
      time: "30:00"
      type: match_end
      description: "&7The match ends (draw if no winner)."
    # Example optional catalog event (default: false) — not scheduled unless a host adds it
    # via the timeline editor's "Add Event" button or /ea timeline add fireworks_finale.
    fireworks_finale:
      name: "Fireworks Finale"
      icon: FIREWORK_ROCKET
      time: "25:00"
      type: fireworks
      default: false
      description: "&dA celebratory firework show over the arena."

# ── Quick actions ─────────────────────────────────────────────────────────────
quick_actions:
  # The Regenerate Map quick action snapshots everyone's team, switches all players to
  # spectators (so the round winds down and MBedwars regenerates the map on its own),
  # then puts everyone back on their old team in the fresh lobby.
  # How long (seconds) to wait for that regeneration before giving up and telling the host.
  regenerate_timeout_seconds: 60
  # Immediately restart the round once everyone is back in the regenerated lobby.
  # When false the arena stays in its lobby and the host starts it manually.
  restart_after_regen: true

# ── Shop overrides ────────────────────────────────────────────────────────────
shop:
  # How items the host disabled appear in the in-game shop:
  #   dye    — shown as red dye with a "disabled" name/lore (players see WHAT was disabled).
  #   remove — hidden from the shop entirely.
  # Buying is blocked either way.
  disabled_display: "dye"
