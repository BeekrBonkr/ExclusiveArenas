  access-party: "&7Access: &bParty only"
  label-lobby: "&aLobby"
  label-running: "&2Running"
  label-ending: "&eEnding"
  label-resetting: "&6Resetting"
  label-stopped: "&cStopped"
  label-unknown: "&8Unknown"
  label-public: "&aPublic"
  label-locked: "&cLocked"
  label-waiting: "waiting"

kickall:
  # %count%
  kicked: "&aKicked &f%count%&a player(s) from the arena."
  none: "&7There was nobody to kick."
  # %arena%
  sent: "&aSent the kick-all request to &f%arena%&a."
  broadcast: "&cThe host cleared the arena."

