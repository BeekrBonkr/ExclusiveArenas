  # %name%, %arena%
  applied: "&aApplied &f%name%&a to &f%arena%&a."
  # %name%
  deleted: "&cDeleted the saved configuration &f%name%&c."
  # %max%
  limit: "&cYou already have %max% saved configurations — delete one first."
