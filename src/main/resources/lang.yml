  beds-destroyed: "&aDestroyed &f%count%&a bed(s)."
  beds-broadcast: "&c&lSUDDEN DEATH! &cAll beds have been destroyed by the host!"
  items-cleared: "&aCleared &f%count%&a dropped item(s) off the ground."
  nothing-to-skip: "&7There is no upcoming timeline event to skip to."
