# ─────────────────────────────────────────────────────────────────────────────
# ExclusiveArenas — lang.yml
#
# Every chat message the plugin sends lives in this file. Edit freely:
#   • Color codes use '&' (e.g. &a = green, &f = white, &l = bold).
#   • Placeholders like %arena% are replaced at runtime — keep them in your
#     text wherever you want that value to appear. Each message lists the
#     placeholders it supports in the comment above it.
#   • Menu button names/lore are NOT here — those live in guis.yml.
#
# Do not change 'config-version': the plugin uses it to upgrade this file
# in place when you install a newer version (your edits are preserved).
# ─────────────────────────────────────────────────────────────────────────────
config-version: 4

general:
  # Sent when the console tries to run /ea.
  players-only: "&cPlayers only."
  # Missing the exclusivearenas.command permission.
  no-permission: "&cYou don't have permission to use ExclusiveArenas."
  # Missing the exclusivearenas.admin permission.
  no-permission-admin: "&cYou don't have permission for that."
  unknown-subcommand: "&cUnknown subcommand. Use &f/ea help &cfor available commands."
  reloaded: "&aExclusiveArenas configuration reloaded."
  # Shown when a menu action targets a match that has ended meanwhile.
  match-gone: "&cThat match no longer exists."
  # Generic "you can't do this from this server" notice.
  arena-other-server: "&cThe arena is on another server."
  not-in-arena: "&cYou are not in an arena."
  not-private-match: "&cThis is not a private match."

join:
  usage: "&cUsage: /ea join <code>"
  invalid-code: "&cInvalid or expired join code."
  not-accepting: "&cThat arena is currently private and not accepting joins."
  # Sent after the plugin pulls a player back in after MBedwars' kick-right-after-join bug. %arena%
  rejoined-after-kick: "&eYou were sent back to &f%arena% &e— you were kicked right after joining."

# Messages players see when the join gate turns them away.
locked:
  private: "&cThat arena is currently private and is not accepting joins."
  # %owner% = host's name
  hint-party: "&cThat arena is private. Join &f%owner%&c's party to enter."
  # %code% = the join code (only shown where the code is meant to be visible)
  hint-code: "&cThat arena is private. Use &f/ea join <code>&c to enter."

host:
  not-hosting: "&cYou aren't hosting a private match."
  ambiguous: "&cYou're hosting more than one private match — stand in the one you mean, or use &f/ea list&c to pick one."
  only-host: "&cOnly the host can do that."
  only-host-menu: "&cOnly the host can manage this match."
  summon-party-only: "&c/ea summon only works for Party-policy matches."

create:
  select-map-first: "&cSelect a map first."
  leave-current-first: "&cLeave your current private match before creating another one."
  code-while-in-party: "&cYou can't host a Join Code match while you're in a party — use Party policy instead, or leave your party first."
  must-be-leader: "&cYou must be the leader of a party to host a Party-policy match."
  # %limit% = the player's arena limit
  limit-reached: "&cYou already host the maximum of &f%limit%&c private matches."
  arena-reserved: "&cThat arena is already reserved by another private match."
  # %arena%
  arena-unavailable: "&f%arena%&c is not available right now (it must be empty and in its lobby)."
  # %arena%
  created: "&aCreated your private match on &f%arena%&a!"
  created-joining: "&aCreated your private match on &f%arena%&a! Sending you in…"
  # %code%
  code-line: "&7Join code: &f%code% &7— share with &f/ea join %code%"
  party-line: "&7Gating: &aParty members only."
  created-not-joining: "&7Use &fGo to Arena&7 in Match Controls whenever you're ready."
  # Player is in someone else's party and can't host.
  party-blocked: "&cYou're in someone else's party — leave it to host your own private match, or use &f/ea join&c to join your leader's match."
  party-blocked-menu: "&cLeave your party before you can host your own private match."
  # A party leader whose party contains someone already hosting their own match.
  member-hosting: "&cA member of your party is already hosting a private match — you can create one once they end theirs."
  member-hosting-menu: "&cA member of your party is already hosting a private match."
  # Hosting several matches at once requires every one of them to be join-code gated.
  party-single: "&cA party-gated match is always your only match — end your current one before creating another."
  multi-code-only: "&cYou can only host multiple matches while every one of them is join-code gated."

route:
  # %arena% — the join command failed to dispatch.
  arena-unavailable: "&cArena &f%arena% &cis unavailable."

match:
  already-begun: "&cThe match has already begun."
  need-more-players: "&cYou need at least one other player in the arena before you can start."
  start-failed: "&cFailed to start the match — see console."
  host-started: "&aThe host started the match!"
  # %arena%
  start-sent: "&aSent the start request to &f%arena%&a."
  # %arena%
  ended: "&aEnded the private match on &f%arena%&a."
  # %arena%
  end-sent: "&aSent the request to end the match on &f%arena%&a."
  ended-broadcast: "&cThe private match has been ended."
  # %code%
  code-regenerated: "&eJoin code regenerated: &f%code% &e— use &f/ea join %code%"
  public-opened: "&aMatch opened — anyone with the code may join."
  public-locked: "&cMatch locked — joining is disabled."

# A PARTY-gated match whose host left (or lost leadership of) their party converts to a
# join-code gate automatically instead of lingering behind a party that no longer exists.
party:
  # Sent to the host. %arena%
  converted-to-code: "&eYour private match on &f%arena%&e is now join-code gated — you no longer lead a party."
  # Broadcast inside the arena.
  converted-broadcast: "&eThis match is now join-code gated — the host is no longer leading a party."

summon:
  not-in-party: "&cYou are not in a party."
  # %count%
  summoning: "&aSummoning &f%count% &aparty member(s)…"
  no-members: "&7You have no other party members to summon."

autosummon:
  enabled: "&aAuto-summon enabled — your party will be kept synced with the match."
  disabled: "&7Auto-summon disabled."
  # %arena%, %owner%
  pulled-in: "&eYou were sent to &f%arena%&e because you're in &f%owner%&e's party."
  # %owner%
  removed: "&cYou were removed from the match because you left &f%owner%&c's party."

teams:
  requires-local: "&cTeam management requires being on the arena's server."
  lobby-only: "&cTeams can only be managed while the arena is in its lobby."
  move-lobby-only: "&cTeams can only be changed while the arena is in its lobby."
  # %count%, %team%
  moved: "&aMoved &f%count%&a player(s) to %team%&a."
  # %count%
  move-skipped: "&c%count% player(s) could not be moved (team full)."
  # %count%
  distributed: "&aDistributed &f%count%&a player(s) evenly across teams."
  # Manage Teams → Lock Teams. The host's own confirmation…
  locked-on: "&aTeams are now locked — players can't switch teams themselves."
  locked-off: "&aTeams are now unlocked — players can pick their own team again."
  # …the announcement everyone in the arena sees when it is toggled…
  locked-broadcast: "&e&l⚠ &eThe host has locked the teams. You can't switch teams any more."
  unlocked-broadcast: "&a&l✔ &aThe host has unlocked the teams — pick whichever you like."
  # …what a player is told when they try to switch anyway…
  locked-switch: "&cTeams are locked for this match. Ask the host to move you."
  # …and what someone joining a locked lobby is told.
  locked-notice: "&7Teams are &clocked&7 in this match — the host assigns them."

# Arena Modifiers → Team Size.
teamsize:
  locked: "&cTeam size can only be changed while the match is in its lobby."
  # %amount%
  changed: "&aPlayers per team set to &f%amount%&a."
  reassign: "&eThe host changed the team size — pick a team again."

environment:
  # %weather% = CLEAR / RAINING / UNTOUCHED
  weather-changed: "&aArena weather set to &f%weather%&a."
  # %time% = NOON / SUNSET / NIGHT / UNTOUCHED
  time-changed: "&aArena time set to &f%time%&a."

spectate:
  # The toggle-spectate lobby hotbar item (see config.yml's lobby-hotbar notes). Hidden once
  # the player is actually spectating — spectator-rejoin.* takes over from there.
  item-name: "&7Spectate This Match"
  item-desc: "&7Sit this match out — you won't play."
  item-hint: "&8▶ Click to spectate"
  lobby-only: "&cYou can only do that while the match is in its lobby."
  switch-failed: "&cCouldn't switch you to spectating — try again."
  now-spectating: "&eYou're now spectating — you won't play this match."

# The rejoin-as-player lobby hotbar item — visible only to spectators (see config.yml's
# lobby-hotbar notes). Hidden once the round is running or the arena has no free player slot.
spectator-rejoin:
  # Clicking dispatches MBedwars' own "/bw join" command, which reports its own
  # success/failure feedback to the player — there are no messages of our own to send.
  item-name: "&aRejoin as Player"
  item-desc: "&7Switch back to playing this match."
  item-hint: "&8▶ Click to rejoin"

# The summon-party lobby hotbar item — visible only to the host of a party-gated match (see
# config.yml's lobby-hotbar notes). Same action as Match Controls' Summon Party button.
party-summon:
  item-name: "&e&lSummon Party"
  item-desc: "&7Pull your online party members"
  item-desc-2: "&7into this lobby."
  item-hint: "&8▶ Click to summon"

cleanup:
  host-abandoned: "&cPrivate match ended: the host did not return in time."
  # %minutes% — private.inactivity_close_grace_minutes
  inactivity-warning: "&eThis private match has had no active players for a while — it will &cclose in %minutes% minute(s)&e unless someone joins in."
  inactivity-closed: "&cPrivate match ended: no one was actively playing."

bossbar:
  # %policy% is one of the three policy labels below.
  title: "&6&lPRIVATE MATCH &8• &e%policy%"
  # %code%
  policy-code: "Code: %code%"
  policy-locked: "Locked"
  policy-party: "Party Only"
  # Appended to the title while the in-game timer is paused.
  timer-paused: " &8• &c⏸ Timer Paused"

# Labels used inside the live status card lore (Match Controls / arena lists).
status:
  # %state%
  state: "&7State: %state%"
  state-remote: "&7State: %state% &8[remote]"
  state-unavailable: "&7State: &8unavailable"
  # %current%, %max%
  players: "&7Players: &f%current%&7/&f%max%"
