  bad-amount: "&cInvalid amount &f%value%&c — use 1 to 64."
  # %currency%
  unknown-currency: "&cUnknown currency &f%currency%&c."
  preset-usage: "&cUsage: /ea preset <list|save|apply|delete> [name]"
  preset-none: "&7You have no saved configurations yet — &f/ea preset save&7 creates one."
  preset-header: "&6Your saved configurations:"
  # %name%
  preset-line: "&8 • &f%name%"
