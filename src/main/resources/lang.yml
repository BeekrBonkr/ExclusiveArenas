  force-win: "&aMatch ended — &f%team%&a awarded the win."
  swap-teams-hint: "&7Use &f/ea swapteams <team-a> <team-b>&7 to swap two teams' rosters."
  # %team-a%, %team-b%
  teams-swapped: "&aSwapped &f%team-a%&a and &f%team-b%&a."
  # %count%
