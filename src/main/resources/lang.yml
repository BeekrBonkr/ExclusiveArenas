  stats-line-alive: "&a✔ &f%team% &7— &f%kills% &7kill(s)"
  stats-line-dead: "&c✘ &7%team% &7— &f%kills% &7kill(s) &8(eliminated)"
  stats-sent: "&aStats announced to the arena."
  paused: "&c&lEmergency Pause &7— everyone is frozen and the timeline is on hold."
  resumed: "&a&lResumed &7— play continues."

modifiers:
  # Shown when a Match Rules toggle is changed. %rule%, %value%
  changed: "&aSet &f%rule%&a to &f%value%&a."
  friendly-fire-on: "&cFriendly fire is now &lON&c for this match."
  friendly-fire-off: "&aFriendly fire is now &lOFF&a for this match."
  bed-saved: "&a&l%team%&a's bed survived its first hit — one-time save used!"
  kill-goal-reached: "&6&l%team% &6reached the &f%goal%&6-kill goal and won the match!"

timeline:
  lobby-only: "&cEvent timings can only be changed while the arena is in its lobby."
  # %event%, %time%
  moved: "&aMoved &f%event%&a to &f%time%&a."
  # %event%
  deleted: "&cRemoved &f%event%&c from this match's timeline."
  cannot-delete-end: "&cMatch End can't be removed — move it instead."
  # %event%
  added: "&aAdded &f%event%&a to this match's timeline."
  add-failed: "&cCouldn't add that event — it may already be scheduled, or you're at the custom-event limit."
  # %time%
  end-moved: "&aMatch length set to &f%time%&a. Other events were rescaled to fit."
  reset: "&aEvent timeline restored to the defaults."
  # %count%
  cleared: "&aRemoved &f%count%&a event(s). Only Match End is left."
  nothing-to-clear: "&7There are no events to clear."
  # %event%, %time%
  duplicated: "&aDuplicated &f%event%&a — the copy fires at &f%time%&a."
  duplicate-failed: "&cThat event can't be duplicated — only events you can build yourself can."
  # %event%, %time% — an existing custom event was re-authored in the editor.
  updated: "&aUpdated &f%event%&a — it fires at &f%time%&a."
  # %max%
  custom-limit: "&cYou've used all &f%max%&c custom events for this match — delete one first."
  value-required: "&cPick what that event applies to first."
  # Broadcast in the arena when a timeline event fires. %event%
  event-fired: "&6&l⚡ &e%event%&6 is now active!"
  # Broadcast when the match-end timer is applied at round start. %time%
  end-applied: "&7This match ends after &f%time%&7."
  # Editor descriptions for events imported from MBedwarsTweaks' custom
  # timeline (only used when that plugin is installed).
  # %type% — the generator drop type being upgraded (e.g. diamond).
  tweaks-gen-upgrade: "&7Upgrades every &f%type%&7 generator on the map."
  tweaks-bed-destroy: "&7Destroys every remaining bed."
  tweaks-sudden-death: "&7Sudden death — every remaining bed is destroyed."
  tweaks-game-over: "&7The match ends when the timer runs out."
  tweaks-plugin: "&7A custom event from MBedwarsTweaks' config."

# Messages specific to the /ea subcommands that mirror menu actions.
cmd:
  # A subcommand that needs the match's join policy to be Join Code (/ea code, /ea public).
  code-only: "&cThat only works for Join Code matches."
  public-usage: "&cUsage: /ea public [on|off] — no argument toggles."
  team-usage: "&cUsage: /ea team <player> <team>"
  # %player%
  team-player-not-found: "&cPlayer &f%player%&c is not in your arena."
  # %team%
  team-unknown: "&cUnknown team &f%team%&c."
  weather-usage: "&cUsage: /ea weather <clear|rain|off>"
  time-usage: "&cUsage: /ea time <noon|sunset|night|off>"
  teamsize-usage: "&cUsage: /ea teamsize <amount|reset>"
  forcewin-usage: "&cUsage: /ea forcewin <team>"
  swapteams-usage: "&cUsage: /ea swapteams <team-a> <team-b>"
  buff-usage: "&cUsage: /ea buff <speed|jump|regen|strength|potion_type> [amplifier] [seconds]"
  timeline-disabled: "&cThe event timeline is disabled on this server."
