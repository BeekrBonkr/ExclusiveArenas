  no-traps-queued: "&7No team has a trap queued right now."
  # %team%
  trap-triggered: "&5Triggered a trap for &f%team%&5."
  # %count%
  traps-cleared: "&aCleared &f%count%&a queued trap(s)."
  upgrades-reset: "&aReset &f%count%&a team upgrade(s)."
  buff-broadcast: "&dThe host buffed everyone!"
  # %count%
  buffed: "&aBuffed &f%count%&a player(s)."
  frozen: "&bEveryone is frozen in place."
  unfrozen: "&aEveryone can move again."
  # %count%
  rejoined: "&aRejoined &f%count%&a disconnected player(s)."
  border-shown: "&eShowing you the arena's match-area border."
  # %time%
  timer-extended: "&aThe host extended the match — now ending at &f%time%&a."
  timer-shortened: "&cThe host shortened the match — now ending at &f%time%&c."
  timer-adjusted: "&aMatch end is now &f%time%&a."
  pvp-disabled: "&cPvP is now &lOFF&c in this arena."
  pvp-enabled: "&aPvP is now &lON&a in this arena."
  stripped-broadcast: "&4The host wiped everyone's inventory!"
  # %count%
  stripped: "&aStripped &f%count%&a player(s)' inventory."
  no-teams-eligible: "&7No team has any players to buff right now."
  # %team%
  comeback-broadcast: "&d%team%&d is getting a comeback buff!"
