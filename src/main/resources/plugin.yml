name: ExclusiveArenas
main: com.slg.exclusivearenas.ExclusiveArenasPlugin
version: 1.2.0
api-version: 1.21

depend: [MBedwars]
softdepend: [MBedwarsTweaks]

commands:
  ea:
    description: ExclusiveArenas — private match creation and controls for MBedwars.
    usage: /ea [menu|arena|list|help|join|start|end|summon|goto|kick|code|public|team|teamsize|weather|time|regen|heal|drop|beds|clearitems|skipevent|balance|trigtrap|cleartraps|resetupgrades|freeze|rejoinall|forcewin|swapteams|buff|border|timeline|shop|preset|admin|reload]
    permission: exclusivearenas.command

permissions:
  exclusivearenas.command:
    description: Allows players to create and manage private arenas.
    default: true
  exclusivearenas.bypass:
    description: Bypasses private-match JOIN restrictions only — lets the holder enter a gated arena without a code/party. Grants NO management access over anyone's match (that is exclusivearenas.admin).
    default: op
  exclusivearenas.admin:
    description: Full admin control — the admin panel, controlling any match, and /ea reload.
    default: op
  exclusivearenas.limit.unlimited:
    description: Allows hosting an unlimited number of simultaneous private matches.
    default: false
