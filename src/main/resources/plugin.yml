name: ExclusiveArenas
main: com.slg.exclusivearenas.ExclusiveArenasPlugin
version: 1.0.0
api-version: 1.21

depend: [MBedwars]

commands:
  ea:
    description: ExclusiveArenas — private match creation and controls for MBedwars.
    usage: /ea [menu|arena|list|help|join|start|end|summon|admin|reload]
    permission: exclusivearenas.command

permissions:
  exclusivearenas.command:
    description: Allows players to create and manage private arenas.
    default: true
  exclusivearenas.bypass:
    description: Allows bypassing private-match join restrictions.
    default: op
  exclusivearenas.admin:
    description: Full admin control — the admin panel, controlling any match, and /ea reload.
    default: op
  exclusivearenas.limit.unlimited:
    description: Allows hosting an unlimited number of simultaneous private matches.
    default: false
