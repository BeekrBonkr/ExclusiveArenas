      glint: false
    settings:
      slot: 10
      material: CRAFTING_TABLE
      name: "&e&lArena Settings"
      lore:
        - "&7Configure event timings and"
        - "&7the in-match shop."
        - "&8"
        - "&8▶ Click to open"
      glint: false
    manage-teams:
      slot: 12
      material: WHITE_BANNER
      name: "&e&lManage Teams"
      lore:
        - "&7Move players between teams"
        - "&7while the arena is in its lobby."
        - "&8"
        - "%availability%"
      glint: false
    # %policy% and %policy_desc% describe the fixed join policy.
    policy:
      slot: 14
      material: NAME_TAG
      name: "&e&lJoin Policy: %policy%"
      lore:
        - "%policy_desc%"
        - "&8"
        - "&8Set when the arena was created."
      glint: false
    quick-actions:
      slot: 16
      material: REDSTONE_TORCH
      name: "&e&lQuick Actions"
      lore:
        - "&7Handy one-click shortcuts"
        - "&7for managing this match."
        - "&8"
        - "&8▶ Click to open"
      glint: false
    start-lobby:
      slot: 19
      material: LIME_CONCRETE
      name: "&a&lStart Match"
      lore:
        - "&7Begin the match right now."
        - "%remote_note%"
        - "&8▶ Click"
      glint: false
    start-running:
      slot: 19
      material: CLOCK
      name: "&7&lStart Match"
      lore:
        - "&7The match has already begun."
      glint: false
    public-on:
      slot: 21
      material: LIME_DYE
      name: "&a&lPublic"
      lore:
        - "&7Anyone with the code can join."
        - "&7Code: &f%code%"
