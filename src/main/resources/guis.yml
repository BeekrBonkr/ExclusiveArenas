# ─────────────────────────────────────────────────────────────────────────────
# ExclusiveArenas — guis.yml
#
# Every menu the plugin opens is described here. For each menu you can change:
#   • title  — supports & color codes and the placeholders noted per menu.
#   • size   — inventory size in slots (multiple of 9, 9–54). Careful: buttons
#              whose slot no longer fits are hidden.
#   • Each button under 'buttons:':
#       slot     — 0-based inventory slot. Set to -1 to hide the button
#                  (its click handler is disabled too).
#       material — any Bukkit material name (e.g. DIAMOND, LIME_CONCRETE).
#       name     — display name (& colors + the placeholders noted per menu).
#       lore     — list of lines. A line that becomes empty after its
#                  placeholder is replaced is dropped, so optional lines work.
#       glint    — true to give the button an enchantment shimmer.
#   • Entries under 'items:' are TEMPLATES for dynamic content (arena icons,
#     player heads, live status cards). Their material comes from the live
#     object, so only name/lore/glint apply.
#
# Paired state buttons (e.g. public-on / public-off) should keep the
# same slot — they are two looks of the same control.
#
# Do not change 'config-version': the plugin uses it to upgrade this file in
# place when you install a newer version (your edits are preserved).
# ─────────────────────────────────────────────────────────────────────────────
config-version: 5

# Materials used to decorate every menu.
global:
  border-material: GRAY_STAINED_GLASS_PANE
  accent-material: CYAN_STAINED_GLASS_PANE
  # Flanks the Kick All / End Match row in Match Controls — a visual "danger zone" cue.
  danger-material: RED_STAINED_GLASS_PANE
  # Appended to a button's lore when its action can't be performed from this server:
  # remote-unavailable — the action is strictly local to the arena's own server.
  # relay-unavailable  — the action could be relayed, but no shared database is connected.
  remote-unavailable-lore: "&c✖ Unavailable — the arena is on another server."
  relay-unavailable-lore: "&c✖ Unavailable — no shared database to relay through."

# ── Main menu (/ea) ──────────────────────────────────────────────────────────
# Placeholders: %hosting% (matches hosted), %limit% (max allowed)
#
# arena-management / create-arena / match-controls are three looks of ONE
# context-sensitive button and should keep the same slot: create-arena shows
# while the player hosts nothing, match-controls while they host their single
# allowed match (limit 1), arena-management otherwise.
main:
  title: "&1&lExclusiveArenas"
  size: 27
  buttons:
    arena-management:
      slot: 10
      material: BEACON
      name: "&b&lArena Management"
      lore:
        - "&7View, create and control your"
        - "&7private matches."
        - "&8"
        - "&7Hosting: &f%hosting%&7/&f%limit%"
        - "&8"
        - "&8▶ Click to open"
      glint: false
    create-arena:
      slot: 10
      material: EMERALD
      name: "&a&lCreate New Arena"
      lore:
        - "&7You aren't hosting anything yet —"
        - "&7set up a new private match."
        - "&8"
        - "&8▶ Click to build"
      glint: false
    # %arena% — the single match the player hosts.
    match-controls:
      slot: 10
      material: NETHER_STAR
      name: "&b&lMatch Controls"
      lore:
        - "&7Manage your private match on"
        - "&f%arena%&7."
        - "&8"
        - "&8▶ Click to open"
      glint: false
    help:
      slot: 12
      material: KNOWLEDGE_BOOK
      name: "&e&lHelp"
      lore:
        - "&7Learn how to use ExclusiveArenas."
        - "&8"
        - "&8▶ Click to view"
      glint: false
    tournaments-soon:
      slot: 14
      material: CLOCK
      name: "&8✦ &7Tournaments &8(Soon)"
      lore:
        - "&8Organise bracket-based tournaments."
        - "&8Not yet available."
      glint: false
    admin:
      slot: 16
      material: COMMAND_BLOCK
      name: "&c&lAdmin Panel"
      lore:
        - "&7View and control &fevery&7 active"
        - "&7private match on this server."
        - "&8"
        - "&8▶ Click to open"
      glint: false
    close:
      slot: 22
      material: BARRIER
      name: "&c&lClose"
      lore: []
      glint: false

# ── Your matches list ────────────────────────────────────────────────────────
# Title placeholders: %page%, %pages%
arena-list:
  title: "&1&lYour Private Matches &8(%page%/%pages%)"
  size: 54
  buttons:
    previous-page:
      slot: 45
      material: ARROW
      name: "&e◀ Previous Page"
      lore: ["&8Go to page %target%."]
      glint: false
    next-page:
      slot: 53
      material: ARROW
      name: "&eNext Page ▶"
      lore: ["&8Go to page %target%."]
      glint: false
    back:
      slot: 48
      material: ARROW
      name: "&7◀ Back"
      lore: ["&8Return to the main menu."]
      glint: false
    create:
      slot: 49
      material: EMERALD
      name: "&a&lCreate New Arena"
      lore:
        - "&7Set up a new private match."
        - "&8"
        - "&7Hosting: &f%hosting%&7/&f%limit%"
        - "&8"
        - "&8▶ Click to build"
      glint: false
    refresh:
      slot: 50
      material: SPYGLASS
      name: "&b&lRefresh"
      lore: ["&8Update live status."]
      glint: false
    empty:
      slot: 22
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: "&7No active matches"
      lore:
        - "&8You are not hosting anything yet."
        - "&8Use &fCreate New Arena&8 below."
      glint: false
  items:
    # One entry per hosted match. %arena%; the lore is followed by the live
    # status lines and the footer below.
    session:
      name: "&f&l%arena%"
      lore: []
      glint: false
    session-footer:
      name: ""
      lore:
        - "&8"
        - "&8▶ Click to manage"
      glint: false

