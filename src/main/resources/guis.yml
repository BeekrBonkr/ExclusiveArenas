      slot: 4
      material: FILLED_MAP
      name: "&b&l%arena%"
      lore: []
      glint: false
    settings:
      slot: 10
      material: CRAFTING_TABLE
      name: "&e&lArena Modifiers"
      lore:
        - "&7Configure event timings and"
        - "&7the in-match shop."
        - "&8"
        - "&8▶ Click to open"
      glint: false
    manage-teams:
      slot: 12
      material: WHITE_BANNER
      name: "&e&lManage Teams"
      lore:
