      glint: false
    public-off:
      slot: 21
      material: RED_DYE
      name: "&c&lLocked"
      lore:
        - "&7Joining is disabled."
        - "&7Code: &f%code%"
        - "&8▶ Click to toggle"
      glint: false
    summon-party:
      slot: 21
      material: ENDER_PEARL
      name: "&e&lSummon Party"
      lore:
        - "&7Pull your online party members"
        - "&7into this lobby."
        - "&8▶ Click"
      glint: false
    regenerate-code:
      slot: 23
      material: TRIPWIRE_HOOK
      name: "&e&lRegenerate Code"
      lore:
        - "&7Invalidate the current code and"
        - "&7generate a fresh one."
        - "&8▶ Click"
      glint: false
    go-to-arena:
      slot: 25
      material: COMPASS
      name: "&b&lGo to Arena"
      lore:
        - "&7Teleport / connect to this match."
        - "&8▶ Click"
      glint: false
    kick-all:
      slot: 30
      material: IRON_SWORD
      name: "&c&lKick All Players"
      lore:
        - "&7Remove every player and spectator"
        - "&7from the arena (except you)."
        - "&7The match itself keeps running."
        - "&8"
        - "&8▶ Click to kick everyone"
      glint: false
    end-match:
      slot: 32
      material: TNT
      name: "&c&lEnd Match"
      lore:
        - "&7Close this private match and"
        - "&7release the arena."
        - "&8▶ Click"
      glint: false
    back:
      slot: 36
      material: ARROW
      name: "&7◀ Back"
      lore: ["%back_hint%"]
      glint: false
    close:
      slot: 44
      material: BARRIER
      name: "&c&lClose"
      lore: []
      glint: false

# ── Quick actions ────────────────────────────────────────────────────────────
# One-click shortcuts, mostly the powers MBedwars reserves for its debug
# commands, driven safely through its API. Title placeholders: %arena%
quick-actions:
  title: "&1&lQuick Actions &8· %arena%"
  size: 36
  buttons:
    regenerate-map:
      slot: 10
      material: GRASS_BLOCK
      name: "&a&lRegenerate Map"
      lore:
        - "&7Rebuild the arena to a pristine state"
        - "&7— placed blocks, broken blocks and"
        - "&7ground items all reset."
        - "&8"
        - "&fPlayers are kept&7: everyone is put"
        - "&7back into the fresh lobby, on the"
        - "&7same teams."
        - "&8"
        - "&8▶ Click to regenerate"
      glint: false
    heal-all:
      slot: 12
      material: GOLDEN_APPLE
      name: "&6&lHeal Everyone"
      lore:
        - "&7Fully restore the health, hunger"
        - "&7and fire status of every player"
        - "&7in the match."
        - "&8"
        - "&8▶ Click to heal"
      glint: false
    drop-spawners:
      slot: 14
      material: DIAMOND
      name: "&b&lTrigger All Generators"
      lore:
        - "&7Make every resource generator in"
        - "&7the arena drop immediately —"
        - "&7one bonus round of resources."
        - "&8"
        - "&8▶ Click to drop"
      glint: false
    destroy-beds:
      slot: 16
      material: RED_BED
      name: "&c&lSudden Death"
      lore:
        - "&7Destroy &fevery&7 remaining bed."
        - "&7No more respawns for anyone —"
        - "&7last team standing wins."
        - "&8"
        - "&8▶ Click to destroy all beds"
      glint: true
    clear-items:
      slot: 21
      material: HOPPER
      name: "&e&lClear Ground Items"
      lore:
        - "&7Remove every dropped item lying"
        - "&7in the arena (lag cleanup)."
        - "&8"
        - "&8▶ Click to clear"
      glint: false
    skip-event:
      slot: 23
      material: ENDER_EYE
      name: "&d&lSkip to Next Event"
      lore:
        - "&7Fire the next timeline event"
        - "&7(e.g. Diamond II) right now"
        - "&7instead of waiting for it."
        - "&8"
        - "&8▶ Click to skip ahead"
      glint: false
    back:
      slot: 31
      material: ARROW
      name: "&7◀ Back"
      lore: ["&8Return to match controls."]
      glint: false

