# ── Team size editor ─────────────────────────────────────────────────────────
# Title placeholders: %arena%
# Only editable while nobody but the host has joined the lobby yet — safe to
# change freely up to that point, disruptive to reshuffle after.
team-size:
  title: "&1&lTeam Size &8· %arena%"
  size: 27
  buttons:
    # %amount% (current players-per-team), %locked% (empty unless locked)
    display:
      slot: 13
      material: WHITE_BANNER
      name: "&d&lPlayers Per Team: &f%amount%"
      lore:
        - "&7How many players fit on each"
        - "&7team in this match."
        - "&8"
        - "%locked%"
      glint: false
    minus-one:
      slot: 11
      material: RED_CONCRETE
      name: "&c&l-1"
      lore: ["&7Lower the per-team limit by one."]
      glint: false
    plus-one:
      slot: 15
      material: LIME_CONCRETE
      name: "&a&l+1"
      lore: ["&7Raise the per-team limit by one."]
      glint: false
    reset:
      slot: 20
      material: TNT_MINECART
      name: "&e&lReset to Default"
      lore:
        - "&7Restore the arena's own"
        - "&7players-per-team value."
        - "&8▶ Click to reset"
      glint: false
    unavailable:
      slot: 13
      material: BARRIER
      name: "&cUnavailable"
      lore: ["%reason%"]
      glint: false
    back:
      slot: 22
      material: ARROW
      name: "&7◀ Back"
      lore: ["&8Return to arena settings."]
      glint: false

# ── Saved configurations (presets) ──────────────────────────────────────────
# Title placeholders: %arena%
# The interior lists one item per saved configuration — click to apply it to
# this match, shift-click to delete it. Save Current Setup snapshots the
# match's timeline and shop settings; it hides once the preset cap is reached.
presets:
  title: "&1&lSaved Configurations &8· %arena%"
  size: 54
  buttons:
    info:
      slot: 4
      material: BOOK
      name: "&6&lSaved Configurations"
      lore:
        - "&7A saved configuration stores a match's"
        - "&7event timeline and shop overrides so"
        - "&7you can reuse them in later matches."
        - "&8"
        - "&8▶ Click a preset to apply it"
        - "&8▶ Shift-click a preset to delete it"
      glint: false
    empty:
      slot: 22
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: "&7No saved configurations"
      lore:
        - "&8You haven't saved anything yet."
        - "&8Use &fSave Current Setup&8 below."
      glint: false
    save-current:
      slot: 49
      material: EMERALD
      name: "&a&lSave Current Setup"
      lore:
        - "&7Snapshot this match's timeline and"
        - "&7shop settings as a new preset."
        - "&8"
        - "&8▶ Click to save"
      glint: false
    back:
      slot: 48
      material: ARROW
      name: "&7◀ Back"
      lore: ["&8Return to arena settings."]
      glint: false
  items:
    # One entry per saved configuration.
    # %name%, %timeline% (summary line below), %disabled%, %priced%.
    preset:
      material: PAPER
      name: "&f&l%name%"
      lore:
        - "&8"
        - "%timeline%"
        - "&7Disabled items: &f%disabled%"
        - "&7Price overrides: &f%priced%"
        - "&8"
        - "&8▶ Click to apply"
        - "&8▶ Shift-click to delete"
      glint: false
  # The %timeline% summary line on each preset item. Custom: %events%.
  summary-default-timeline: "&8Default timeline"
  summary-custom-timeline: "&7Custom timeline &8(%events% events)"

# ── Preset naming (anvil) ─────────────────────────────────────────────────────
# Opens when a player clicks "Save Current Setup". Type a name in the anvil's
# text field, then take the result item (right-hand slot) to confirm — no XP
# is actually spent, the level cost shown is cosmetic and ignored.
preset-name:
  title: "&1Name this configuration"
  buttons:
    icon:
      material: PAPER
      name: "%name%"
      lore:
        - "&7Type a name above, then take"
        - "&7the result to save it."
      glint: false

# ── Event timeline editor ────────────────────────────────────────────────────
# Title placeholders: %arena%
# The interior top two rows show the events left→right in match order. Click
# an event to select it; the editor controls appear on the bottom row.
timeline:
  title: "&1&lEvent Timeline &8· %arena%"
  size: 54
  buttons:
    info:
      slot: 4
      material: KNOWLEDGE_BOOK
      name: "&b&lHow this works"
      lore:
        - "&7Events fire this many minutes after"
        - "&7the match starts, from left to right."
        - "&8"
        - "&7• &fClick&7 an event to select it, then"
        - "&7  use the buttons below to move it."
        - "&7• &fMatch End&7 shows the &ftotal match"
        - "&7  time&7 instead — it can be moved but"
        - "&7  never deleted, and shortening the"
        - "&7  match rescales every other event."
        - "&8"
        - "&7Changes apply when the match starts."
      glint: false
    minus-minute:
      slot: 37
      material: RED_CONCRETE
      name: "&c&l-1 Minute"
      lore: ["&7Move &f%event%&7 one minute earlier."]
      glint: false
    minus-seconds:
      slot: 38
      material: RED_TERRACOTTA
      name: "&c-5 Seconds"
      lore: ["&7Move &f%event%&7 five seconds earlier."]
      glint: false
    delete:
      slot: 40
      material: LAVA_BUCKET
      name: "&4&lDelete Event"
      lore:
        - "&7Remove &f%event%&7 from this match"
        - "&7entirely — it will never fire."
      glint: false
    plus-seconds:
      slot: 42
      material: LIME_TERRACOTTA
      name: "&a+5 Seconds"
      lore: ["&7Move &f%event%&7 five seconds later."]
      glint: false
    plus-minute:
      slot: 43
      material: LIME_CONCRETE
      name: "&a&l+1 Minute"
      lore: ["&7Move &f%event%&7 one minute later."]
      glint: false
    reset:
      slot: 49
      material: TNT_MINECART
      name: "&e&lReset to Defaults"
      lore:
        - "&7Restore the default timings and"
        - "&7bring back deleted events."
        - "&8▶ Click to reset"
      glint: false
    back:
      slot: 45
      material: ARROW
      name: "&7◀ Back"
      lore: ["&8Return to arena settings."]
      glint: false
    close:
      slot: 53
      material: BARRIER
      name: "&c&lClose"
      lore: []
      glint: false
  items:
    # A regular timeline event. %event%, %time% (m:ss from match start),
    # %effect% (what it does, from config.yml's description).
    event:
      name: "&e&l%event%"
      lore:
        - "&7Fires at: &f%time%&7 into the match"
        - "&7Effect: %effect%"
        - "&8"
        - "&8▶ Click to select & edit"
      glint: false
    # The same event while selected in the editor.
    event-selected:
      name: "&a&l%event% &7(selected)"
      lore:
        - "&7Fires at: &f%time%&7 into the match"
        - "&7Effect: %effect%"
        - "&8"
        - "&8Use the buttons below to move or"
        - "&8delete it. Click again to deselect."
      glint: true
    # Match End — always the last item on the timeline. %time%, %effect%
    match-end:
      name: "&c&lMatch End"
      lore:
        - "&7Total match time: &f%time%"
        - "&7Effect: %effect%"
        - "&8"
        - "&7Moving this &fearlier&7 rescales every"
        - "&7other event to fit the shorter match."
        - "&8"
        - "&8▶ Click to select & move (can't delete)"
      glint: false
    match-end-selected:
      name: "&a&lMatch End &7(selected)"
      lore:
        - "&7Total match time: &f%time%"
        - "&7Effect: %effect%"
        - "&8"
        - "&7Moving this &fearlier&7 rescales every"
        - "&7other event to fit the shorter match."
        - "&8"
        - "&8Use the buttons below to move it."
      glint: true

